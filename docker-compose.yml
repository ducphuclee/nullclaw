services:
  gateway:
    build: 
      context: .
      dockerfile: Dockerfile
      target: release
    # Không có image directive
    ports:
      - "8080:3000"
    env_file:
      - path: .env
        required: false
    command: ["gateway", "--port", "3000", "--host", "::"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build: 
      context: .
      dockerfile: Dockerfile
      target: release
    # Không có image directive
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    command: ["agent"]
    restart: unless-stopped
